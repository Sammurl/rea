name: Sync to Gitee
on:
  workflow_dispatch: # 手动触发
  push:
    branches: [ main ] # 推送main分支自动同步

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync to Gitee
        uses: wearerequired/git-mirror-action@v1
        with:
          source-repo: ${{ github.event.repository.clone_url }}
          destination-repo: git@gitee.com:你的gitee用户名/你的仓库名.git
          destination-ssh-key: ${{ secrets.GITEE_SSH_PRIVATE_KEY }}
          destination-known-hosts: ${{ secrets.GITEE_KNOWN_HOSTS }}
