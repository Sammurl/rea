name: Mirror GitHub to Gitee
on:
  workflow_dispatch: # 支持手动触发（你现在的模式）
  push:
    branches: [ main ]
  delete:
    branches: [ main ]

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror to Gitee
        uses: Yikun/hub-mirror-action@master
        with:
          src: github/${{ github.repository }}
          dst: gitee/Sam/rea
          dst_key: ${{ secrets.GITEE_SSH_PRIVATE_KEY }}
          dst_known_hosts: ${{ secrets.GITEE_KNOWN_HOSTS }}
          static_branch: '^main'
          # 开启完整镜像（同步所有分支、tag、删除也同步）
          mirror_type: 'all'
