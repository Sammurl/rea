name: Mirror GitHub to Gitee (HTTPS Token)
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full repository (全部分支+tag)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror push to Gitee
        env:
          GITEE_USER: Samurl
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          TARGET_REPO="rea"
          TARGET_URL="https://${GITEE_USER}:${GITEE_TOKEN}@gitee.com/${GITEE_USER}/${TARGET_REPO}.git"
          
          git remote remove gitee || true
          git remote add gitee "${TARGET_URL}"
          echo "==== 目标地址 ===="
          echo "${TARGET_URL}"
          echo "==== 开始全量镜像 push --mirror ===="
          git push --mirror gitee
