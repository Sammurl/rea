name: Sync GitHub to Gitee
on:
  push:
    branches: [ main ] # 如果你的主分支叫 master，这里改成 master
  workflow_dispatch: # 支持手动点按钮触发同步

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          mirror: true

      - name: Mirror push to Gitee
        uses: wearerequired/git-mirror-action@v1
        with:
          source-repo: ${{ github.repositoryUrl }}
          destination-repo: https://oauth2:${{ secrets.GITEE_TOKEN }}@gitee.com/${{ secrets.GITEE_OWNER }}/${{ secrets.GITEE_REPO }}.git
