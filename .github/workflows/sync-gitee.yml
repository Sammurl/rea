name: Mirror GitHub to Gitee
on:
  workflow_dispatch:   # 支持手动触发
  push:
    branches: [ main ]

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full repo (带全部历史、tag)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure SSH for Gitee
        env:
          SSH_PRIVATE_KEY: ${{ secrets.GITEE_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # 关闭主机校验，避免known_hosts报错
          echo -e "Host gitee.com\n  StrictHostKeyChecking no\n  UserKnownHostsFile /dev/null" > ~/.ssh/config

      - name: Mirror push to Gitee
        run: |
          git remote add gitee git@gitee.com:Sam/rea.git
          git push --mirror gitee
