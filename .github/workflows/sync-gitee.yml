name: Mirror to Gitee
on:
  workflow_dispatch:   # 支持手动点按钮触发（你截图里的方式）
  push:
    branches: [ main ] # 往main推送代码自动同步
  delete:              # 删除分支/tag也同步过去
    branches: [ main ]

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror repository to Gitee
        uses: pixta-dev/repository-mirroring-action@v1
        with:
          target_repo_url: git@gitee.com:Sam/rea.git
          ssh_private_key: ${{ secrets.GITEE_SSH_PRIVATE_KEY }}
          mirror: true
